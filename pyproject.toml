[project]
name = "polymarket-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.5",
    "numpy>=1.26",
    "websockets>=13",
    "requests>=2.31",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
